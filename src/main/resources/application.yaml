spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/event_hub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    # ${DB_PASSWORD} 的含义：
    #   先找环境变量 DB_PASSWORD，找到就用它；找不到就用冒号后面的默认值 123456。
    # 之前写成 ${DB_PASSWORD}（没有默认值）：环境变量没设置时，
    #   @ConfigurationProperties 绑定不会报错，而是把字面量 "${DB_PASSWORD}"
    #   当成密码发给 MySQL，于是报 Access denied ... (using password: YES)。
    password: ${DB_PASSWORD}

mybatis-plus:
  # XML 映射文件的位置。注意必须是【目录】mapper/，
  # 写成 mapper.XxxMapper.xml（中间是点)会被当成"文件名里带点的单个文件"，
  # 不匹配这个通配规则，XML 根本不会被加载 —— 报 Invalid bound statement (not found)。
  # 默认值就是 classpath*:/mapper/**/*.xml，显式写出来是为了让这个约定可见。
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印 SQL 日志，任务书明确要求
  global-config:
    db-config:
      logic-delete-field: deleted # 全局逻辑删除字段
      logic-delete-value: 1
      logic-not-delete-value: 0
jwt:
  secret: ${JWT_SECRET:eventHubSecretKeyForJwtTokenMustBeLongEnough1234567890}
  expiration: 86400000